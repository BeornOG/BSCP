[workspace]
resolver = "2"
members = ["crates/common", "crates/userserver", "crates/channelserver"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots", "connect"] }
webrtc = "0.14"
futures-util = "0.3"
socket2 = "0.5"
axum-extra = { version = "0.9", features = ["cookie", "cookie-private", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit", "cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
argon2 = "0.5"
rand = "0.8"
base32 = "0.5"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
mime_guess = "2"
dotenvy = "0.15"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "8", features = ["axum"] }

[profile.release]
strip = true
lto = "thin"
