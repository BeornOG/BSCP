<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BSCP - Register</title>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e1e1e; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 300px; }
        h1 { margin-top: 0; font-size: 1.5rem; text-align: center; }
        .subtitle { text-align: center; color: #aaa; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; background: #03dac6; color: #121212; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #04f0d9; }
        .errors { background: #3d1f1f; border: 1px solid #c0392b; padding: 10px; border-radius: 4px; margin-bottom: 15px; color: #e74c3c; }
        .errors li { margin: 5px 0; }
        .links { text-align: center; margin-top: 15px; }
        .links a { color: #03dac6; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Create Account</h1>
        <p class="subtitle">Enter your invite code</p>

        {% if errors %}
        <div class="errors">
            <ul>
                {% for error in errors %}
                <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
        {% endif %}

        <form method="POST">
            <input name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="password_confirm" placeholder="Confirm Password" required>
            <input name="invite_code" placeholder="Invite Code" required>
            <button type="submit">Create Account</button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="{{ url_for('web.login') }}">Log In</a></p>
        </div>
    </div>
</body>
</html>
